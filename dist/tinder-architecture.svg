<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%" style="background-color: #121212; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Virgil', sans-serif;">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="800" y="70" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold" letter-spacing="1">Tinder Architecture: How Swipes & Matches Work at Scale</text>

  <!-- Flow Arrows -->
  <path d="M 180 400 L 250 400" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>
  <path d="M 410 400 L 480 400" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>
  <path d="M 640 400 L 710 400" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>
  <path d="M 940 400 L 1010 400" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>
  <path d="M 1240 400 L 1310 400" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow)" filter="url(#rough)"/>

  <!-- Step 1: Client Apps -->
  <g transform="translate(40, 310)">
    <rect width="140" height="180" rx="16" fill="#1a1a1a" stroke="#ffffff" stroke-width="3" filter="url(#rough)"/>
    <text x="70" y="80" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Tinder</text>
    <rect x="20" y="105" width="100" height="24" rx="6" fill="#2a2a2a" stroke="#ffffff" stroke-width="1"/>
    <text x="70" y="122" text-anchor="middle" fill="#dddddd" font-size="12">Swipes</text>
    <rect x="20" y="135" width="100" height="24" rx="6" fill="#2a2a2a" stroke="#ffffff" stroke-width="1"/>
    <text x="70" y="152" text-anchor="middle" fill="#dddddd" font-size="12">Matches / Chat</text>
  </g>

  <!-- Step 2: API Gateway -->
  <g transform="translate(250, 320)">
    <rect width="160" height="160" rx="20" fill="#1a1a1a" stroke="#ff4d4d" stroke-width="3.5" filter="url(#rough)"/>
    <text x="80" y="75" text-anchor="middle" fill="#ff4d4d" font-size="20" font-weight="bold">API Gateway</text>
    <text x="80" y="105" text-anchor="middle" fill="#aaaaaa" font-size="14">(Auth & Load</text>
    <text x="80" y="125" text-anchor="middle" fill="#aaaaaa" font-size="14">Balancing)</text>
  </g>

  <!-- Step 3: Swipe Queue (Pub/Sub) -->
  <g transform="translate(480, 320)">
    <rect width="160" height="160" rx="20" fill="#1a1a1a" stroke="#ff944d" stroke-width="3.5" filter="url(#rough)"/>
    <text x="80" y="75" text-anchor="middle" fill="#ff944d" font-size="20" font-weight="bold">Pub/Sub Queue</text>
    <text x="80" y="105" text-anchor="middle" fill="#aaaaaa" font-size="14">(Kafka / Redis</text>
    <text x="80" y="125" text-anchor="middle" fill="#aaaaaa" font-size="14">Swipe Streams)</text>
  </g>

  <!-- Step 4: Matcher Workers (Group Box) -->
  <g transform="translate(710, 180)">
    <rect width="230" height="440" rx="24" fill="#1a1a1a" stroke="#4d94ff" stroke-width="3" stroke-dasharray="8 6" filter="url(#rough)"/>
    <text x="115" y="45" text-anchor="middle" fill="#4d94ff" font-size="22" font-weight="bold">Matcher Workers</text>

    <rect x="25" y="75" width="180" height="65" rx="12" fill="#262626" stroke="#4d94ff" stroke-width="2"/>
    <text x="115" y="113" text-anchor="middle" fill="#ffffff" font-size="18">Worker 1</text>

    <rect x="25" y="160" width="180" height="65" rx="12" fill="#262626" stroke="#4d94ff" stroke-width="2"/>
    <text x="115" y="198" text-anchor="middle" fill="#ffffff" font-size="18">Worker 2</text>

    <text x="115" y="275" text-anchor="middle" fill="#4d94ff" font-size="28">• • •</text>

    <rect x="25" y="320" width="180" height="65" rx="12" fill="#262626" stroke="#4d94ff" stroke-width="2"/>
    <text x="115" y="358" text-anchor="middle" fill="#ffffff" font-size="18">Worker N</text>
  </g>

  <!-- Step 5: Geo-Sharded Indices (Group Box) -->
  <g transform="translate(1010, 180)">
    <rect width="230" height="440" rx="24" fill="#1a1a1a" stroke="#4dff88" stroke-width="3" stroke-dasharray="8 6" filter="url(#rough)"/>
    <text x="115" y="45" text-anchor="middle" fill="#4dff88" font-size="22" font-weight="bold">Geo-Sharded DBs</text>
    <text x="115" y="70" text-anchor="middle" fill="#888888" font-size="14">(By Geohash)</text>

    <rect x="25" y="95" width="180" height="65" rx="12" fill="#262626" stroke="#4dff88" stroke-width="2"/>
    <text x="115" y="133" text-anchor="middle" fill="#ffffff" font-size="18">Shard 1 (NY)</text>

    <rect x="25" y="180" width="180" height="65" rx="12" fill="#262626" stroke="#4dff88" stroke-width="2"/>
    <text x="115" y="218" text-anchor="middle" fill="#ffffff" font-size="18">Shard 2 (LA)</text>

    <text x="115" y="285" text-anchor="middle" fill="#4dff88" font-size="28">• • •</text>

    <rect x="25" y="330" width="180" height="65" rx="12" fill="#262626" stroke="#4dff88" stroke-width="2"/>
    <text x="115" y="368" text-anchor="middle" fill="#ffffff" font-size="18">Shard N (London)</text>
  </g>

  <!-- Step 6: Storage & Clusters (Group Box) -->
  <g transform="translate(1310, 180)">
    <rect width="250" height="440" rx="24" fill="#1a1a1a" stroke="#b366ff" stroke-width="3" stroke-dasharray="8 6" filter="url(#rough)"/>
    <text x="125" y="45" text-anchor="middle" fill="#b366ff" font-size="22" font-weight="bold">Storage &amp; Realtime</text>

    <!-- Cell 1 -->
    <rect x="20" y="80" width="210" height="150" rx="16" fill="#262626" stroke="#b366ff" stroke-width="2"/>
    <text x="125" y="115" text-anchor="middle" fill="#b366ff" font-size="16" font-weight="bold">Cell: Realtime Chat &amp; Match</text>
    <rect x="35" y="130" width="180" height="35" rx="8" fill="#1a1a1a" stroke="#b366ff" stroke-width="1"/>
    <text x="125" y="153" text-anchor="middle" fill="#dddddd" font-size="13">Match DB (Postgres)</text>
    <rect x="35" y="175" width="180" height="35" rx="8" fill="#1a1a1a" stroke="#b366ff" stroke-width="1"/>
    <text x="125" y="198" text-anchor="middle" fill="#dddddd" font-size="13">Redis Session Cache</text>

    <!-- Cell 2 -->
    <rect x="20" y="255" width="210" height="150" rx="16" fill="#262626" stroke="#b366ff" stroke-width="2"/>
    <text x="125" y="290" text-anchor="middle" fill="#b366ff" font-size="16" font-weight="bold">Cell: Media &amp; Profiles</text>
    <rect x="35" y="305" width="180" height="35" rx="8" fill="#1a1a1a" stroke="#b366ff" stroke-width="1"/>
    <text x="125" y="328" text-anchor="middle" fill="#dddddd" font-size="13">100+ TB S3 Storage</text>
    <rect x="35" y="350" width="180" height="35" rx="8" fill="#1a1a1a" stroke="#b366ff" stroke-width="1"/>
    <text x="125" y="373" text-anchor="middle" fill="#dddddd" font-size="13">Edge CDN Nodes</text>
  </g>

  <!-- Footer Tagline -->
  <text x="800" y="740" text-anchor="middle" fill="#666666" font-size="16">Designed for LinkedIn Post • Inspired by Excalidraw Dark Mode System Design Architecture</text>
</svg>
